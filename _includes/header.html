<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="shortcut icon" href="{{ '/assets/img/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="stylesheet" type="text/css" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
  {% seo %}
</head>

<body class="{{ page.layout }}">

  <div class="page-header pt-4 pb-5">
    <div class="container-lg">
      <div class="text-center">
        <a href="{{ '/' | relative_url }}">
          <img class="logo py-3" src="{{ '/assets/img/logo.svg' | relative_url }}" alt="{{ site.title }}"></a>
        <ul class="nav-center">
          <li class="text-center d-block d-sm-inline-block px-1 px-md-3"><a href="{{ '/' | relative_url }}" class="text-white">Syllabus</a></li>
          <li class="text-center d-block d-sm-inline-block px-1 px-md-3"><a href="https://github.com/RaikaSurendra/floci-microservices-online-boutique" class="text-white">Project Repo</a></li>
          <li class="text-center d-block d-sm-inline-block px-1 px-md-3"><a href="https://github.com/RaikaSurendra/online-boutique-curriculum" class="text-white">Source</a></li>
          <li class="text-center d-block d-sm-inline-block px-1 px-md-3"><a href="https://github.com/GoogleCloudPlatform/microservices-demo" class="text-white">Online Boutique</a></li>
        </ul>
      </div>
    </div>
  </div>
  <!-- .full-width closes in home.html and module.html layouts -->
