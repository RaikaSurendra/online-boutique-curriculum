# Site settings
title: "Online Boutique on Kubernetes"
description: "A hands-on tour of Docker, Kubernetes, microservices & AWS EKS — built on Google Online Boutique running locally."
url: "https://raikasurendra.github.io"
baseurl: "/online-boutique-curriculum"

# Theme: pages-themes/hacker (dark terminal aesthetic)
remote_theme: pages-themes/hacker

# Build settings
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
permalink: pretty

# Defaults: module pages get the "module" layout automatically
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: module
  - scope:
      path: "index.md"
      type: pages
    values:
      layout: home

# Exclude repo-internal files from the built site
exclude:
  - README.md
  - STYLE.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .gitignore

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag